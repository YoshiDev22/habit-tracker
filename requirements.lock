# Árbol completo de dependencias de producción, con las transitivas fijadas.
# requirements.txt dice QUÉ usa la app; este archivo dice con QUÉ versiones
# exactas se probó. En el VPS y en CI se instala este:
#
#     pip install -r requirements.lock
#
# Regenerarlo (solo al cambiar requirements.txt), en un venv vacío con Linux:
#
#     python3.10 -m venv /tmp/lock && /tmp/lock/bin/pip install -r requirements.txt
#     /tmp/lock/bin/pip freeze
#
# y copiar las versiones aquí, conservando esta cabecera y los marcadores.
#
# Generado el 2026-09-30 con Python 3.10 en Linux, la versión más baja que
# puede tener el VPS (Ubuntu 22.04): generado con una más nueva, pip elige
# versiones que ya no instalan en 3.10 (websockets 17 pide 3.11). Probado en
# 3.10, 3.11, 3.12 y 3.13. Dos marcadores: uvloop lleva el mismo que le pone
# uvicorn[standard], porque no existe en Windows; exceptiongroup solo hace
# falta antes de 3.11.
