[pytest]
testpaths = tests
# Las pruebas de navegador (tests/ui) necesitan Edge o Chrome: van aparte.
#   pytest          -> pruebas de API (rápidas, sin navegador)
#   pytest -m ui    -> pruebas de navegador
addopts = -m "not ui"
markers =
    ui: prueba de navegador (Edge o Chrome headless); se corre con `pytest -m ui`
filterwarnings =
    # Avisos internos de Starlette/httpx con las versiones fijadas del stack
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:httpx.*
    ignore::DeprecationWarning:jose.*
