# Pruebas de API en cada push a una rama y a mano desde la pestaña Actions. Las
# etiquetas no: el push de un release (main + vX.Y.Z) corría todo dos veces.
# Las de navegador (pytest -m ui) se quedan fuera: tardan más de 10 minutos y
# pytest.ini ya las deja fuera por defecto.
name: tests

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  pytest:
    # Fijo, no ubuntu-latest (pasa a Ubuntu 26 el 2026-10-19): el mismo sistema
    # que el VPS, y que no cambie sin avisar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Las de Ubuntu 22.04 y 24.04 LTS: el VPS corre con una de las dos
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: pytest
